# Builds Windows, macOS and Linux binaries. Pushing a tag like v0.1.0 also publishes
# them as a GitHub release; running it by hand (Actions tab) only builds.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-universal
          - os: ubuntu-22.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      - name: Build
        if: runner.os != 'macOS'
        run: cargo build --release --locked

      # One binary for both Apple Silicon and Intel Macs.
      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/roblox-online-tray \
            target/aarch64-apple-darwin/release/roblox-online-tray \
            target/x86_64-apple-darwin/release/roblox-online-tray

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path target/release/roblox-online-tray.exe, README.md `
            -DestinationPath dist/roblox-online-tray-${{ matrix.name }}.zip

      - name: Package (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          mkdir dist
          tar -czf dist/roblox-online-tray-${{ matrix.name }}.tar.gz \
            -C target/release roblox-online-tray -C ../.. README.md

      - uses: actions/upload-artifact@v4
        with:
          name: roblox-online-tray-${{ matrix.name }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
